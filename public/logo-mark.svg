<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>BrewMind Logo</title>
  <desc>Stylized coffee bean with orbital ring and signal pulse — coffee as the center of your universe.</desc>

  <defs>
    <!-- Bean: copper gradient, light top-left to dark bottom-right -->
    <linearGradient id="brewmind-bean-fill" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#D4935A"/>
      <stop offset="40%" stop-color="#A05C30"/>
      <stop offset="100%" stop-color="#5C2E10"/>
    </linearGradient>

    <!-- Ring front: bright gold at start (top-left), fading toward bottom-right -->
    <linearGradient id="brewmind-ring-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="100%" stop-color="#C4842A"/>
    </linearGradient>

    <!-- Ring back: starts matching front end color, fades to dark -->
    <linearGradient id="brewmind-ring-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4963A"/>
      <stop offset="35%" stop-color="#C4842A"/>
      <stop offset="100%" stop-color="#7A4E1A"/>
    </linearGradient>

    <!-- Bean specular: glossy highlight top-left (slightly stronger for small-size clarity) -->
    <radialGradient id="brewmind-bean-gloss" cx="0.35" cy="0.28" r="0.4">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#D4935A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4935A" stop-opacity="0"/>
    </radialGradient>

    <!-- Signal pulse glow: gold-core with teal fringe (tech accent) -->
    <radialGradient id="brewmind-pulse-glow" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#F5C96A" stop-opacity="0.50"/>
      <stop offset="50%" stop-color="#5AB3A0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5AB3A0" stop-opacity="0"/>
    </radialGradient>

    <!-- Signal pulse core: bright gold center -->
    <radialGradient id="brewmind-pulse-core" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#FDE8B0"/>
      <stop offset="40%" stop-color="#F5C96A"/>
      <stop offset="100%" stop-color="#E8A838"/>
    </radialGradient>

    <!-- Clip path: bean shape to clip the crease -->
    <clipPath id="brewmind-bean-clip">
      <path d="
        M 50,26
        C 42,26  35,34  34,45
        C 33,55  38,65  45,68
        C 47,69  50,69  50,69
        C 50,69  53,69  55,68
        C 62,65  67,55  66,45
        C 65,34  58,26  50,26
        Z"/>
    </clipPath>

    <!--
      Clip path for front ring: punch out only the UPPER bean area.
      Ring enters bean at ~(40,31) upper-left, exits at ~(66,45) right.
      Upper bean = left bezier to bean top + right bezier to exit + diagonal close.
      Below this boundary the front ring paints OVER the bean (3D orbit effect).
    -->
    <clipPath id="brewmind-ring-front-clip">
      <path clip-rule="evenodd" d="
        M 0,0 H 100 V 100 H 0 Z
        M 40,31
        C 43,28  46,26  50,26
        C 58,26  65,34  67,47
        Z"/>
    </clipPath>
  </defs>

  <!-- === RING BACK: full ellipse, behind bean in z-order === -->
  <ellipse cx="50" cy="47" rx="38" ry="12" transform="rotate(30 50 47)"
    fill="none" stroke="url(#brewmind-ring-back)" stroke-width="3.5"/>

  <!-- === BEAN === -->
  <path d="
    M 50,26
    C 42,26  35,34  34,45
    C 33,55  38,65  45,68
    C 47,69  50,69  50,69
    C 50,69  53,69  55,68
    C 62,65  67,55  66,45
    C 65,34  58,26  50,26
    Z"
    fill="url(#brewmind-bean-fill)"/>

  <!-- Center crease: clipped to bean shape -->
  <g clip-path="url(#brewmind-bean-clip)">
    <path d="M 50,25 C 48.5,35 51.5,43 49,48 C 47,53 52,59 50,70"
      fill="none" stroke="#3D1E08" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Glossy specular highlight (top-left, white-to-copper fade) -->
  <ellipse cx="43" cy="37" rx="6" ry="9" fill="url(#brewmind-bean-gloss)"/>

  <!-- === RING FRONT: full ellipse, clipped to outside upper-bean only === -->
  <!-- Below the ring crossing line, the ring paints OVER the bean = 3D depth -->
  <g clip-path="url(#brewmind-ring-front-clip)">
    <ellipse cx="50" cy="47" rx="38" ry="12" transform="rotate(30 50 47)"
      fill="none" stroke="url(#brewmind-ring-front)" stroke-width="3.5"/>
  </g>

  <!-- === SIGNAL PULSE (on-ring, where orbit emerges from behind bean) === -->
  <circle cx="18" cy="34" r="6"
    fill="url(#brewmind-pulse-glow)" opacity="0.9"/>
  <circle cx="18" cy="34" r="3"
    fill="url(#brewmind-pulse-core)" stroke="#C4842A" stroke-width="0.4"/>
</svg>
