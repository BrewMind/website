<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>BrewMind Logo</title>
  <desc>Stylized coffee bean with orbital ring — coffee as the center of your universe.</desc>

  <defs>
    <!-- Bean: copper gradient, light top-left to dark bottom-right -->
    <linearGradient id="brewmind-bean-fill" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#D4935A"/>
      <stop offset="40%" stop-color="#A05C30"/>
      <stop offset="100%" stop-color="#5C2E10"/>
    </linearGradient>

    <!-- Ring front: bright gold at start (top-left), fading toward bottom-right -->
    <linearGradient id="brewmind-ring-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="100%" stop-color="#C4842A"/>
    </linearGradient>

    <!-- Ring back: starts matching front end color, fades to dark -->
    <linearGradient id="brewmind-ring-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4963A"/>
      <stop offset="35%" stop-color="#C4842A"/>
      <stop offset="100%" stop-color="#7A4E1A"/>
    </linearGradient>

    <!-- Bean specular: glossy highlight top-left -->
    <radialGradient id="brewmind-bean-gloss" cx="0.35" cy="0.28" r="0.4">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#D4935A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D4935A" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot: radial highlight top-left (glossy) -->
    <radialGradient id="brewmind-dot-grad" cx="0.35" cy="0.3" r="0.65">
      <stop offset="0%" stop-color="#F5C96A"/>
      <stop offset="100%" stop-color="#E8A838"/>
    </radialGradient>

    <!-- Clip path: bean shape to clip the crease -->
    <clipPath id="brewmind-bean-clip">
      <path d="
        M 50,26
        C 42,26  35,34  34,45
        C 33,55  38,65  45,68
        C 47,69  50,69  50,69
        C 50,69  53,69  55,68
        C 62,65  67,55  66,45
        C 65,34  58,26  50,26
        Z"/>
    </clipPath>
  </defs>

  <!-- === RING BACK HALF (behind bean) === -->
  <ellipse cx="50" cy="47" rx="38" ry="12" transform="rotate(30 50 47)"
    fill="none" stroke="url(#brewmind-ring-back)" stroke-width="2"
    stroke-dasharray="136.8 102" stroke-dashoffset="102"/>

  <!-- === BEAN === -->
  <path d="
    M 50,26
    C 42,26  35,34  34,45
    C 33,55  38,65  45,68
    C 47,69  50,69  50,69
    C 50,69  53,69  55,68
    C 62,65  67,55  66,45
    C 65,34  58,26  50,26
    Z"
    fill="url(#brewmind-bean-fill)"/>

  <!-- Center crease: clipped to bean shape so it never overflows -->
  <g clip-path="url(#brewmind-bean-clip)">
    <path d="M 50,25 C 48.5,35 51.5,43 49,48 C 47,53 52,59 50,70"
      fill="none" stroke="#3D1E08" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Glossy specular highlight (top-left, white-to-copper fade) -->
  <ellipse cx="43" cy="37" rx="6" ry="9" fill="url(#brewmind-bean-gloss)"/>

  <!-- === RING FRONT HALF (in front of bean) === -->
  <ellipse cx="50" cy="47" rx="38" ry="12" transform="rotate(30 50 47)"
    fill="none" stroke="url(#brewmind-ring-front)" stroke-width="2"
    stroke-dasharray="110 128.8" stroke-dashoffset="0"/>

  <!-- Accent dot (top-left, brightest point — light source origin) -->
  <circle cx="17" cy="31" r="3"
    fill="url(#brewmind-dot-grad)" stroke="#C4842A" stroke-width="0.5"/>
</svg>
