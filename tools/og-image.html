<!doctype html>
<!--
  Quelle fuer public/og-image.png (1200x630). Kein Build-Schritt: die Datei
  aendert sich nur, wenn Claim oder Farben sich aendern.

  Neu rendern (vom Repo-Root):
    npx serve -l 4397 .
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --hide-scrollbars --virtual-time-budget=8000 --window-size=1200,630 \
      --screenshot=public/og-image.png http://localhost:4397/tools/og-image.html
-->

<html lang="de"><head><meta charset="utf-8" />
<style>
  @font-face { font-family: 'Calistoga'; src: url('../node_modules/@fontsource/calistoga/files/calistoga-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'Inter'; src: url('../public/fonts/inter-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }

  :root {
    --bg: #181210; --bg-deep: #120D0B; --surface: #231A15; --border: #3C2E24;
    --ink: #F4EDE4; --ink-2: #CBBBA8; --ink-3: #9C8B79;
    --accent: #E0A458; --weight: #C07E30; --flow: #4589C4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: var(--bg); overflow: hidden; position: relative;
         font-family: 'Inter', system-ui, sans-serif; }

  /* Warme Tiefe von oben, wie im Hero */
  .glow { position: absolute; top: -280px; left: 50%; transform: translateX(-50%);
          width: 1100px; height: 700px; border-radius: 9999px;
          background: rgba(224,164,88,0.08); filter: blur(90px); }

  /* Die Signatur der Seite: Gewichts- und Flow-Kurve */
  svg.sig { position: absolute; inset: auto 0 0 0; width: 1200px; height: 300px; opacity: .3;
            mask-image: linear-gradient(to right, transparent, black 14%, black 86%, transparent); }

  .inner { position: relative; height: 100%; display: flex; flex-direction: column;
           justify-content: center; padding: 0 84px; }

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  .brand img { width: 44px; height: 44px; }
  .brand span { font-size: 30px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }

  h1 { font-family: 'Calistoga', Georgia, serif; font-size: 78px; line-height: 1.08;
       color: var(--ink); font-weight: 400; }
  h1 em { font-style: normal; color: var(--accent); }

  p.sub { margin-top: 26px; font-size: 27px; line-height: 1.45; color: var(--ink-2); max-width: 820px; }

  .foot { position: absolute; left: 84px; right: 84px; bottom: 46px;
          display: flex; justify-content: space-between; align-items: center; }
  .label { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .14em;
           text-transform: uppercase; color: var(--ink-3); }
  .dom { font-family: 'JetBrains Mono', monospace; font-size: 16px; color: var(--accent); }
</style></head>
<body>
  <div class="glow"></div>

  <svg class="sig" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,190 C20,190 30,188 40,185 C80,175 120,130 200,90 C280,50 340,35 380,30 L400,28"
          fill="none" stroke="#C07E30" stroke-width="1.5" vector-effect="non-scaling-stroke" />
    <path d="M0,192 C15,190 25,182 40,152 C50,132 60,102 75,97 C110,92 150,94 200,90 C240,88 270,97 310,122 C340,142 360,162 380,172 L400,176"
          fill="none" stroke="#4589C4" stroke-width="1.5" vector-effect="non-scaling-stroke" />
  </svg>

  <div class="inner">
    <div class="brand"><img src="../public/logo-mark.svg" alt="" /><span>BrewMind</span></div>
    <h1>Espresso einstellen,<br /><em>ohne zu raten.</em></h1>
    <p class="sub">Jeder Shot aufgenommen, live über die Waage oder per Timer. Pro Bohne gemerkt, was funktioniert hat.</p>
  </div>

  <div class="foot">
    <span class="label">Siebträger · Lokal · Ohne Account</span>
    <span class="dom">brewmind.app</span>
  </div>
</body></html>
